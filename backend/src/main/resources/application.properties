spring.application.name=ideastruct-ai
server.port=${PORT:8080}

# MongoDB Configuration
# Mapped from MONGODB_URI environment variable with local fallback
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ideastruct_ai}

# AI Provider Configuration (Gemini)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.timeout-seconds=45
gemini.max-output-tokens=8192

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# Logging
logging.level.com.ideastruct=INFO
logging.level.org.springframework.data.mongodb=INFO

