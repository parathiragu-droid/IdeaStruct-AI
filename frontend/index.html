<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ideastruct-ai-logo.png" />
    <link rel="apple-touch-icon" href="/ideastruct-ai-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IdeaStruct AI — AI-powered project planner for Software, Hardware, and Hybrid projects." />
    <meta property="og:image" content="/ideastruct-ai-logo.png" />
    <title>IdeaStruct AI — From Simple Ideas to Structured Project Plans</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ideastruct-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
